{% extends "base.html" %}
{% block title %}Change Password - Gayatri Vidyapeeth{% endblock %}
{% block content %}

<div class="max-w-xl mx-auto mt-6 mb-12">
    <div class="bg-white rounded-3xl card-shadow overflow-hidden border border-amber-100">
        <div class="gold-saffron-grad px-6 py-5 flex items-center gap-3 text-white">
            <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-lg shadow-sm">
                <i class="fas fa-key"></i>
            </div>
            <div>
                <h2 class="font-bold text-lg font-serif">Security Settings &bull; Change Password</h2>
                <p class="text-xs text-amber-100">Update your account credentials</p>
            </div>
        </div>

        <form method="POST" class="p-6 md:p-8 space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Current Password</label>
                <div class="relative">
                    <input type="password" name="old_password" id="old_password" required placeholder="••••••••"
                        class="w-full px-4 py-3.5 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:ring-4 focus:ring-amber-500/15 focus:outline-none bg-amber-50/30 text-gray-800 transition pr-12 text-sm font-medium">
                    <button type="button" onclick="togglePassword('old_password', 'eye_old')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-amber-600 transition">
                        <i id="eye_old" class="fas fa-eye text-base"></i>
                    </button>
                </div>
            </div>
            
            <div class="border-t border-gray-100 my-4 pt-4"></div>
            
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">New Password</label>
                <div class="relative">
                    <input type="password" name="new_password" id="new_password" required placeholder="••••••••"
                        class="w-full px-4 py-3.5 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:ring-4 focus:ring-amber-500/15 focus:outline-none bg-amber-50/30 text-gray-800 transition pr-12 text-sm font-medium">
                    <button type="button" onclick="togglePassword('new_password', 'eye_new')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-amber-600 transition">
                        <i id="eye_new" class="fas fa-eye text-base"></i>
                    </button>
                </div>
                <p class="text-xs text-gray-400 mt-1.5 flex items-center gap-1">
                    <i class="fas fa-shield-alt text-amber-500"></i> Use minimum 8 characters with a mix of letters and numbers
                </p>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Confirm New Password</label>
                <div class="relative">
                    <input type="password" name="confirm_password" id="confirm_password" required placeholder="••••••••"
                        class="w-full px-4 py-3.5 rounded-xl border-2 border-amber-100 focus:border-amber-500 focus:ring-4 focus:ring-amber-500/15 focus:outline-none bg-amber-50/30 text-gray-800 transition pr-12 text-sm font-medium">
                    <button type="button" onclick="togglePassword('confirm_password', 'eye_confirm')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-amber-600 transition">
                        <i id="eye_confirm" class="fas fa-eye text-base"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="w-full gold-saffron-grad text-white font-bold py-4 rounded-xl hover:opacity-95 transition mt-6 text-base shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-save"></i>
                <span>Update Password</span>
            </button>
        </form>
    </div>
</div>

<script>
    function togglePassword(inputId, eyeId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(eyeId);
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }
</script>

{% endblock %}
